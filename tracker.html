<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nutrition Tracker - Log Meals</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      color: #333;
    }
    nav {
      margin-top: 10px;
      text-align: center;
    }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #007bff;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    nav a:hover {
      background-color: rgba(0, 123, 255, 0.1);
    }
    .container {
      flex: 1;
      padding: 40px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .container h2 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #log {
      margin-top: 30px;
      background: #fff;
      padding: 20px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    #log p {
      margin: 8px 0;
      font-size: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Nutrition Tracker</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="tracker.html">Tracker</a>
    </nav>
  </header>

  <div class="container">
    <h2>Log Your Meal</h2>
    <div class="form-group">
      <label for="food">Food Name</label>
      <input type="text" id="food" placeholder="e.g. Apple, Rice, etc." />
    </div>
    <div class="form-group">
      <label for="calories">Calories (kcal)</label>
      <input type="number" id="calories" placeholder="e.g. 120" />
    </div>
    <button onclick="addFood()">Add Food</button>

    <div id="log"></div>
  </div>

  <script>
    let foodLog = [];

    function addFood() {
      const food = document.getElementById("food").value.trim();
      const calories = document.getElementById("calories").value.trim();
      if (!food || !calories) {
        alert("Please enter both food name and calories");
        return;
      }
      foodLog.push({ food, calories });
      renderLog();
      alert(`${food} added: ${calories} kcal`);
      document.getElementById("food").value = "";
      document.getElementById("calories").value = "";
    }

    function renderLog() {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML = "";
      foodLog.forEach(item => {
        const p = document.createElement("p");
        p.textContent = `${item.food} — ${item.calories} kcal`;
        logDiv.appendChild(p);
      });
    }

    // Optional: reminder in tracker
    const reminders = [
      { time: "11:00", message: "Time for a snack 🍎" },
      { time: "15:00", message: "Drink water 💧" }
    ];

    function scheduleReminders() {
      reminders.forEach(rem => {
        const now = new Date();
        const [h, m] = rem.time.split(":");
        let t = new Date();
        t.setHours(h, m, 0, 0);
        let delay = t - now;
        if (delay < 0) delay += 24 * 60 * 60 * 1000;
        setTimeout(function repeat() {
          alert(rem.message);
          setTimeout(repeat, 24 * 60 * 60 * 1000);
        }, delay);
      });
    }

    scheduleReminders();
  </script>
</body>
</html>
