<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Alerts</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  margin: 0;
  background: linear-gradient(to right, #ffecd2, #fcb69f);
  color: #333;
}
header {
  background-color: #ff6b81;
  padding: 20px;
  text-align: center;
  color: #fff;
}
nav { text-align: center; margin-top: 10px; }
nav a {
  display: inline-block;
  margin: 10px;
  padding: 10px 25px;
  background-color: #ff8fa3;
  color: #fff;
  text-decoration: none;
  border-radius: 10px;
  font-size: 18px;
  transition: 0.3s;
}
nav a:hover { background-color: #ff4757; }

.container { padding: 30px 20px; text-align: center; }
button {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background-color: #ff6b81;
  color: #fff;
  cursor: pointer;
  margin: 10px;
  transition: 0.3s;
}
button:hover { background-color: #ff4757; }
</style>
</head>
<body>

<header>
  <h1>Food Alerts</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="tracker.html">Tracker</a>
  <a href="food-alerts.html">Food Alerts</a>
</nav>

<div class="container">
  <h2>Check Food Warnings</h2>
  <button onclick="alertFood('High Sugar')">High Sugar Alert</button>
  <button onclick="alertFood('Too Fatty')">Fatty Food Alert</button>
  <button onclick="alertFood('Low Protein')">Low Protein Alert</button>
</div>

<script>
function alertFood(type) {
  switch(type) {
    case 'High Sugar':
      alert("⚠️ Warning: This food is high in sugar!");
      break;
    case 'Too Fatty':
      alert("⚠️ Warning: This food is high in fat!");
      break;
    case 'Low Protein':
      alert("⚠️ Note: This food is low in protein!");
      break;
  }
}
</script>

</body>
</html>
