<header>
  <h1>Women's Nutrition Tracker</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="tracker.html">Tracker</a>
</nav>

<div class="container">
  <h2>Welcome, Moms!</h2>
  <p>This app helps you track your meals and gives diet reminders throughout the day.</p>
  <button onclick="alert('Welcome! Stay healthy and happy! 💖')">Click for Welcome Alert</button>
</div>

<script>
// ==== Diet Reminders ====
const reminders = [
  { time: "07:30", message: "Good morning! 🌞 Drink a glass of water 💧" },
  { time: "08:00", message: "Breakfast time 🍳 – include protein and fiber" },
  { time: "10:30", message: "Snack time 🍎 – fruits or nuts are recommended" },
  { time: "12:30", message: "Lunch time 🍲 – balanced meal with protein, carbs, veggies" },
  { time: "15:30", message: "Snack alert 🍌 – fruits, yogurt, or nuts" },
  { time: "17:30", message: "Drink water 💧 – stay hydrated" },
  { time: "19:00", message: "Dinner time 🍛 – lighter meal recommended" },
  { time: "21:30", message: "Relaxation drink 🥛 – warm milk or herbal tea" }
];

function scheduleReminders() {
  reminders.forEach(reminder => {
    const now = new Date();
    const [hour, minute] = reminder.time.split(":");
    let reminderTime = new Date();
    reminderTime.setHours(hour, minute, 0, 0);
    let delay = reminderTime - now;
    if (delay < 0) delay += 24 * 60 * 60 * 1000; // schedule for next day if past
    setTimeout(function repeat() {
      alert(reminder.message);
      setTimeout(repeat, 24 * 60 * 60 * 1000); // repeat daily
    }, delay);
  });
}
scheduleReminders();
</script>

</body>
